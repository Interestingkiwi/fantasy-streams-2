# Render Blueprint - draft-prep deployment for Fantasy Streams.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
# Creates one Postgres database and one web service, both paid tier.
# See docs/DEPLOY.md for the full walkthrough (including populating the DB).

databases:
  - name: fantasy-streams-db
    plan: basic-256mb          # smallest paid Postgres; data here is a few MB
    databaseName: fantasy_streams
    user: fantasy_streams
    region: virginia

services:
  - type: web
    name: fantasy-streams
    runtime: python
    plan: starter
    region: virginia            # must match the database region
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --timeout 120"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-streams-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Yahoo OAuth. sync: false declares the variable without putting the
      # secret in git - set both values in the Render dashboard. Until they
      # are set the app boots fine and /login reports that Yahoo is disabled.
      - key: YAHOO_CONSUMER_KEY
        sync: false
      - key: YAHOO_CONSUMER_SECRET
        sync: false
      # YAHOO_REDIRECT_URI is intentionally unset: it is then built from the
      # request as https://<service>.onrender.com/callback, which is what has
      # to be registered in the Yahoo developer console.
      #
      # SKIP_SCHEMA_INIT is deliberately absent. It used to be "1" because
      # draft-prep needs no admin tables, but auth stores tokens in `users`,
      # so the startup DDL has to run. It is CREATE TABLE IF NOT EXISTS.
